{% load static catalog_extras %}
<div class="product-card" data-product-id="{{ product.id }}">
    <div class="card-image-wrap">
        {% if product.photo %}
            <img src="{{ product.photo.url }}" alt="{{ product.name }}" class="card-image">
        {% else %}
            <div class="card-image-placeholder">📦</div>
        {% endif %}
    </div>

    <div class="card-body">
        <h3 class="card-name">{{ product.name }}</h3>
        <p class="card-price">₹{{ product.price }}</p>

        {% if cart_items and product.id in cart_items %}
            <!-- Product already in cart — show stepper -->
            <div class="qty-stepper">
                <button class="qty-minus" data-product-id="{{ product.id }}" aria-label="Decrease quantity">−</button>
                <span class="qty-display" id="qty-{{ product.id }}">{{ cart_items|get_item:product.id }}</span>
                <button class="qty-plus" data-product-id="{{ product.id }}" aria-label="Increase quantity">+</button>
            </div>
        {% else %}
            <!-- Not in cart — show Add button -->
            <button class="add-btn" data-product-id="{{ product.id }}">Add</button>
        {% endif %}
    </div>
</div>

<style>
    .product-card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .card-image-wrap {
        width: 100%;
        height: 180px;
        overflow: hidden;
        background-color: #f8f9fa;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .card-image-placeholder {
        font-size: 3.5rem;
        color: #cccccc;
    }

    .card-body {
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .card-name {
        font-size: 0.95rem;
        font-weight: 600;
        color: #333;
        line-height: 1.3;
    }

    .card-price {
        font-size: 1rem;
        font-weight: 700;
        color: #28a745;
    }

    .add-btn {
        background-color: #FFD700;
        color: #333;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.2s;
    }

    .add-btn:hover {
        background-color: #e6c200;
    }

    .qty-stepper {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: #FFD700;
        border-radius: 6px;
        overflow: hidden;
    }

    .qty-minus,
    .qty-plus {
        background: none;
        border: none;
        font-size: 1.3rem;
        font-weight: 700;
        padding: 6px 14px;
        cursor: pointer;
        color: #333;
        transition: background-color 0.15s;
    }

    .qty-minus:hover,
    .qty-plus:hover {
        background-color: #e6c200;
    }

    .qty-display {
        font-size: 1rem;
        font-weight: 700;
        color: #333;
        min-width: 24px;
        text-align: center;
    }
</style>
